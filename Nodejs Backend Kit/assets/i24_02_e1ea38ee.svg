<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="system-ui,Segoe UI,Roboto,sans-serif">
  <rect x="10" y="10" width="800" height="340" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">highWaterMark: the Internal Buffer Limit</text>

  <!-- Writable buffer tank -->
  <text x="410" y="80" text-anchor="middle" font-size="14" fill="#64748b">write() returns a boolean based on buffered bytes vs. highWaterMark</text>

  <rect x="310" y="100" width="200" height="200" rx="12" fill="#fff" stroke="#334155" stroke-width="2"/>
  <!-- fill -->
  <rect x="312" y="210" width="196" height="88" fill="#f0fdf4"/>
  <line x1="310" y1="160" x2="510" y2="160" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="530" y="164" font-size="13" fill="#dc2626">highWaterMark (default 16 KB)</text>
  <text x="410" y="255" text-anchor="middle" font-size="13" fill="#16a34a">buffered</text>
  <text x="410" y="275" text-anchor="middle" font-size="13" fill="#16a34a">chunks</text>

  <!-- below HWM -->
  <path d="M120 210 H305" stroke="#16a34a" stroke-width="2" marker-end="url(#hg)"/>
  <text x="120" y="200" font-size="13" font-weight="bold" fill="#16a34a">write() → true</text>
  <text x="120" y="228" font-size="12" fill="#64748b">below limit, keep writing</text>

  <!-- above HWM -->
  <path d="M700 130 H515" stroke="#dc2626" stroke-width="2" marker-end="url(#hr)"/>
  <text x="600" y="120" font-size="13" font-weight="bold" fill="#dc2626">write() → false</text>
  <text x="560" y="325" text-anchor="middle" font-size="12" fill="#64748b">at/over limit → stop, wait for 'drain'</text>

  <defs>
    <marker id="hg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#16a34a"/></marker>
    <marker id="hr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#dc2626"/></marker>
  </defs>
</svg>
