<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420">
  <rect x="10" y="10" width="800" height="400" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#0f172a">The WebSocket upgrade handshake</text>

  <rect x="60" y="80" width="200" height="70" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="160" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e40af">Client (Browser)</text>
  <text x="160" y="134" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">new WebSocket(url)</text>

  <rect x="560" y="80" width="200" height="70" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#166534">Server (Node ws)</text>
  <text x="660" y="134" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">http.Server upgrade</text>

  <line x1="160" y1="150" x2="160" y2="380" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="660" y1="150" x2="660" y2="380" stroke="#cbd5e1" stroke-width="2"/>

  <line x1="160" y1="190" x2="655" y2="190" stroke="#3b82f6" stroke-width="2" marker-end="url(#b15)"/>
  <text x="410" y="182" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">GET /ws HTTP/1.1  Upgrade: websocket  Connection: Upgrade</text>
  <text x="410" y="208" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Sec-WebSocket-Key: (random base64)</text>

  <line x1="660" y1="252" x2="165" y2="252" stroke="#16a34a" stroke-width="2" marker-end="url(#b15b)"/>
  <text x="410" y="244" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">HTTP/1.1 101 Switching Protocols</text>
  <text x="410" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Sec-WebSocket-Accept: (hash of key)</text>

  <rect x="210" y="300" width="400" height="60" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="410" y="326" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#6b21a8">Same TCP socket, now full-duplex frames</text>
  <text x="410" y="348" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Either side sends text/binary messages until close</text>

  <defs>
    <marker id="b15" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3b82f6"/></marker>
    <marker id="b15b" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
  </defs>
</svg>
