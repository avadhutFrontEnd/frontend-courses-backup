<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380">
  <rect x="10" y="10" width="800" height="360" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#0f172a">The HTTP request / response lifecycle</text>

  <rect x="40" y="90" width="150" height="70" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="115" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e3a8a">Client</text>
  <text x="115" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">browser / curl</text>

  <rect x="335" y="90" width="150" height="70" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#166534">http.Server</text>
  <text x="410" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">createServer</text>

  <rect x="630" y="90" width="150" height="70" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="705" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#6b21a8">Handler</text>
  <text x="705" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">(req, res)</text>

  <line x1="190" y1="115" x2="330" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#a7)"/>
  <text x="260" y="107" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">1. request</text>
  <line x1="485" y1="115" x2="625" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#a7)"/>
  <text x="555" y="107" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">2. emit event</text>

  <line x1="705" y1="160" x2="705" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#a7)"/>
  <line x1="410" y1="230" x2="410" y2="162" stroke="#64748b" stroke-width="2" marker-end="url(#a7)"/>
  <line x1="115" y1="162" x2="115" y2="115" stroke="#64748b" stroke-width="0"/>

  <rect x="335" y="230" width="370" height="60" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="520" y="256" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#166534">3. res.writeHead + res.write + res.end</text>
  <text x="520" y="276" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">status line, headers, body streamed back</text>

  <line x1="335" y1="260" x2="190" y2="260" stroke="#16a34a" stroke-width="2" marker-end="url(#a7g)"/>
  <line x1="115" y1="230" x2="115" y2="162" stroke="#16a34a" stroke-width="2" marker-end="url(#a7g)"/>
  <rect x="40" y="230" width="150" height="60" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="115" y="264" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">4. response</text>

  <text x="410" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">req is a ReadableStream, res is a WritableStream — one TCP socket, both directions</text>

  <defs>
    <marker id="a7" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="a7g" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
