<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="10" y="10" width="800" height="380" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="45" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">Where async errors surface</text>

  <rect x="50" y="85" width="220" height="130" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="160" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Callback</text>
  <text x="160" y="140" text-anchor="middle" font-size="12" fill="#64748b">error arrives as</text>
  <text x="160" y="160" text-anchor="middle" font-size="12" fill="#64748b">the first arg (err)</text>
  <text x="160" y="188" text-anchor="middle" font-size="12" fill="#dc2626">try/catch cannot catch it</text>

  <rect x="300" y="85" width="220" height="130" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="410" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Promise</text>
  <text x="410" y="140" text-anchor="middle" font-size="12" fill="#64748b">rejection travels down</text>
  <text x="410" y="160" text-anchor="middle" font-size="12" fill="#64748b">the chain to .catch</text>
  <text x="410" y="188" text-anchor="middle" font-size="12" fill="#dc2626">skips .then handlers</text>

  <rect x="550" y="85" width="220" height="130" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">async/await</text>
  <text x="660" y="140" text-anchor="middle" font-size="12" fill="#64748b">rejection becomes</text>
  <text x="660" y="160" text-anchor="middle" font-size="12" fill="#64748b">a thrown error</text>
  <text x="660" y="188" text-anchor="middle" font-size="12" fill="#16a34a">try/catch works again</text>

  <rect x="180" y="270" width="460" height="90" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="410" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Unhandled → process warning</text>
  <text x="410" y="326" text-anchor="middle" font-size="12" fill="#64748b">no .catch / no try-catch fires</text>
  <text x="410" y="346" text-anchor="middle" font-size="12" fill="#64748b">'unhandledRejection' event, may crash</text>

  <line x1="160" y1="215" x2="330" y2="268" stroke="#dc2626" stroke-width="2" marker-end="url(#a4)"/>
  <line x1="410" y1="215" x2="410" y2="268" stroke="#dc2626" stroke-width="2" marker-end="url(#a4)"/>
  <line x1="660" y1="215" x2="490" y2="268" stroke="#dc2626" stroke-width="2" marker-end="url(#a4)"/>

  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
