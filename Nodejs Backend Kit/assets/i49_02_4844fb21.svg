<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380">
  <rect x="10" y="10" width="800" height="360" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#0f172a">A request passing through defense layers</text>

  <rect x="40" y="80" width="130" height="220" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="105" y="108" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">Request</text>
  <text x="105" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">from client</text>

  <rect x="195" y="80" width="130" height="220" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="260" y="104" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#6b21a8">1. helmet</text>
  <text x="260" y="126" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#334155">secure headers</text>
  <text x="260" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#6b21a8">2. rate limit</text>
  <text x="260" y="182" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#334155">throttle abuse</text>
  <text x="260" y="216" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#6b21a8">3. CORS</text>
  <text x="260" y="238" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#334155">allow-list origins</text>
  <text x="260" y="272" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#6b21a8">4. body limit</text>
  <text x="260" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#334155">cap payload size</text>

  <rect x="350" y="80" width="130" height="220" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="415" y="104" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">5. authN</text>
  <text x="415" y="126" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#334155">verify identity</text>
  <text x="415" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">6. authZ</text>
  <text x="415" y="192" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#334155">check permission</text>
  <text x="415" y="236" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">7. validate</text>
  <text x="415" y="258" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#334155">schema + sanitize</text>

  <rect x="505" y="80" width="130" height="220" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="570" y="104" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">8. handler</text>
  <text x="570" y="126" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#334155">business logic</text>
  <text x="570" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">parameterized</text>
  <text x="570" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">queries only</text>
  <text x="570" y="232" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">escape output</text>
  <text x="570" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">on render</text>

  <rect x="660" y="80" width="120" height="220" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="720" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#166534">Safe</text>
  <text x="720" y="202" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">response</text>

  <line x1="170" y1="190" x2="193" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#f11)"/>
  <line x1="325" y1="190" x2="348" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#f11)"/>
  <line x1="480" y1="190" x2="503" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#f11)"/>
  <line x1="635" y1="190" x2="658" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#f11)"/>

  <text x="410" y="340" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">No single layer is enough — defense in depth means each stage assumes the others can fail.</text>

  <defs>
    <marker id="f11" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
  </defs>
</svg>
