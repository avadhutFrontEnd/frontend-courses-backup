<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="820" height="340" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">Commit path vs rollback path</text>

  <rect x="330" y="70" width="160" height="46" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="410" y="99" text-anchor="middle" font-size="14" font-weight="bold" fill="#9333ea">BEGIN / startTxn</text>

  <rect x="330" y="132" width="160" height="46" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="410" y="153" text-anchor="middle" font-size="12" fill="#334155">debit account A</text>
  <text x="410" y="170" text-anchor="middle" font-size="12" fill="#64748b">write #1</text>

  <rect x="330" y="194" width="160" height="46" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="410" y="215" text-anchor="middle" font-size="12" fill="#334155">credit account B</text>
  <text x="410" y="232" text-anchor="middle" font-size="12" fill="#64748b">write #2</text>

  <rect x="300" y="264" width="220" height="46" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="293" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">COMMIT &#8594; both durable</text>

  <line x1="410" y1="116" x2="410" y2="132" stroke="#94a3b8" stroke-width="2" marker-end="url(#d10)"/>
  <line x1="410" y1="178" x2="410" y2="194" stroke="#94a3b8" stroke-width="2" marker-end="url(#d10)"/>
  <line x1="410" y1="240" x2="410" y2="264" stroke="#94a3b8" stroke-width="2" marker-end="url(#d10)"/>

  <rect x="560" y="194" width="220" height="46" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="670" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#dc2626">error before commit</text>
  <text x="670" y="233" text-anchor="middle" font-size="12" fill="#64748b">ROLLBACK &#8594; nothing kept</text>
  <line x1="490" y1="217" x2="560" y2="217" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#e10)"/>

  <defs>
    <marker id="d10" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="e10" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <text x="410" y="330" text-anchor="middle" font-size="13" fill="#64748b">Either both writes land together, or the whole unit is undone</text>
</svg>