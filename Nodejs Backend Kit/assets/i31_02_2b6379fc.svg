<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="10" y="10" width="800" height="340" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">A request's journey through an Express app</text>

  <rect x="40" y="130" width="120" height="90" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="100" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Client</text>
  <text x="100" y="192" text-anchor="middle" font-size="12" fill="#64748b">HTTP request</text>

  <rect x="200" y="130" width="130" height="90" rx="12" fill="#faf5ff" stroke="#9333ea"/>
  <text x="265" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Middleware</text>
  <text x="265" y="186" text-anchor="middle" font-size="12" fill="#64748b">logger, json,</text>
  <text x="265" y="203" text-anchor="middle" font-size="12" fill="#64748b">auth (next)</text>

  <rect x="370" y="130" width="130" height="90" rx="12" fill="#faf5ff" stroke="#9333ea"/>
  <text x="435" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Router</text>
  <text x="435" y="186" text-anchor="middle" font-size="12" fill="#64748b">match method</text>
  <text x="435" y="203" text-anchor="middle" font-size="12" fill="#64748b">+ path</text>

  <rect x="540" y="130" width="130" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="605" y="164" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Handler</text>
  <text x="605" y="186" text-anchor="middle" font-size="12" fill="#64748b">your logic,</text>
  <text x="605" y="203" text-anchor="middle" font-size="12" fill="#64748b">res.json()</text>

  <rect x="710" y="130" width="70" height="90" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="745" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">Reply</text>
  <text x="745" y="192" text-anchor="middle" font-size="12" fill="#64748b">to client</text>

  <line x1="160" y1="175" x2="198" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#a8)"/>
  <line x1="330" y1="175" x2="368" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#a8)"/>
  <line x1="500" y1="175" x2="538" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#a8)"/>
  <line x1="670" y1="175" x2="708" y2="175" stroke="#94a3b8" stroke-width="2" marker-end="url(#a8)"/>

  <text x="410" y="280" text-anchor="middle" font-size="13" fill="#334155">Every layer receives (req, res, next) and either responds or calls next()</text>
  <text x="410" y="306" text-anchor="middle" font-size="12" fill="#64748b">If any layer calls next(err), Express skips ahead to the error handler</text>

  <defs>
    <marker id="a8" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>