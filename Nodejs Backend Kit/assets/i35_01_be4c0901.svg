<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="10" y="10" width="800" height="400" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">req reads the request, res writes the response</text>

  <rect x="45" y="80" width="350" height="300" rx="14" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="220" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">req (incoming)</text>

  <rect x="70" y="126" width="300" height="44" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="220" y="153" text-anchor="middle" font-size="13" fill="#334155">req.params — /users/:id path values</text>

  <rect x="70" y="180" width="300" height="44" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="220" y="207" text-anchor="middle" font-size="13" fill="#334155">req.query — ?page=2 parsed object</text>

  <rect x="70" y="234" width="300" height="44" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="220" y="261" text-anchor="middle" font-size="13" fill="#334155">req.body — parsed body (needs mw)</text>

  <rect x="70" y="288" width="300" height="44" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="220" y="315" text-anchor="middle" font-size="13" fill="#334155">req.headers — req.get('Content-Type')</text>

  <rect x="70" y="342" width="300" height="30" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="220" y="362" text-anchor="middle" font-size="12" fill="#64748b">req.method, req.path, req.cookies</text>

  <rect x="425" y="80" width="350" height="300" rx="14" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="600" y="108" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">res (outgoing)</text>

  <rect x="450" y="126" width="300" height="44" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="600" y="153" text-anchor="middle" font-size="13" fill="#334155">res.status(201) — set status code</text>

  <rect x="450" y="180" width="300" height="44" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="600" y="207" text-anchor="middle" font-size="13" fill="#334155">res.json(obj) — JSON + Content-Type</text>

  <rect x="450" y="234" width="300" height="44" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="600" y="261" text-anchor="middle" font-size="13" fill="#334155">res.send(body) — string/Buffer/object</text>

  <rect x="450" y="288" width="300" height="44" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="600" y="315" text-anchor="middle" font-size="13" fill="#334155">res.redirect('/login') — 302 + Location</text>

  <rect x="450" y="342" width="300" height="30" rx="10" fill="#ffffff" stroke="#94a3b8"/>
  <text x="600" y="362" text-anchor="middle" font-size="12" fill="#64748b">res.set(), res.cookie(), res.end()</text>
</svg>