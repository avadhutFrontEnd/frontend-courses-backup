<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="10" y="10" width="800" height="410" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">The process object: your program's control panel</text>

  <rect x="310" y="75" width="200" height="60" rx="12" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="410" y="103" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">process</text>
  <text x="410" y="124" text-anchor="middle" font-size="12" fill="#64748b">a global object</text>

  <rect x="45" y="180" width="220" height="100" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="155" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">process.argv</text>
  <text x="155" y="232" text-anchor="middle" font-size="12" fill="#64748b">command-line</text>
  <text x="155" y="250" text-anchor="middle" font-size="12" fill="#64748b">arguments array</text>

  <rect x="300" y="180" width="220" height="100" rx="12" fill="#faf5ff" stroke="#9333ea"/>
  <text x="410" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">process.env</text>
  <text x="410" y="232" text-anchor="middle" font-size="12" fill="#64748b">environment</text>
  <text x="410" y="250" text-anchor="middle" font-size="12" fill="#64748b">variables object</text>

  <rect x="555" y="180" width="220" height="100" rx="12" fill="#fff7ed" stroke="#ea580c"/>
  <text x="665" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">process.cwd()</text>
  <text x="665" y="232" text-anchor="middle" font-size="12" fill="#64748b">current working</text>
  <text x="665" y="250" text-anchor="middle" font-size="12" fill="#64748b">directory</text>

  <line x1="360" y1="135" x2="180" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="410" y1="135" x2="410" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="460" y1="135" x2="640" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#a3)"/>

  <rect x="45" y="315" width="730" height="90" rx="12" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="410" y="343" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">More on process</text>
  <text x="410" y="368" text-anchor="middle" font-size="12" fill="#64748b">process.exit(code) end program   |   process.on('exit', ...) hooks</text>
  <text x="410" y="390" text-anchor="middle" font-size="12" fill="#64748b">process.platform, process.pid, process.memoryUsage()</text>

  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#334155"/>
    </marker>
  </defs>
</svg>
