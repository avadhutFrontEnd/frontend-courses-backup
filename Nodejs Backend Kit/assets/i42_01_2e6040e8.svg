<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="820" height="400" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">Relational tables vs document store</text>

  <rect x="40" y="70" width="350" height="300" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="215" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#3b82f6">SQL: rows in tables</text>
  <rect x="70" y="120" width="290" height="34" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="215" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">users: id | name | email</text>
  <rect x="70" y="158" width="290" height="30" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
  <text x="215" y="178" text-anchor="middle" font-size="12" fill="#64748b">1 | Ada | ada@x.com</text>
  <rect x="70" y="192" width="290" height="30" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1"/>
  <text x="215" y="212" text-anchor="middle" font-size="12" fill="#64748b">2 | Lin | lin@x.com</text>
  <rect x="70" y="238" width="290" height="34" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="215" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">orders: id | user_id | total</text>
  <text x="215" y="300" text-anchor="middle" font-size="12" fill="#334155">Fixed columns, JOIN on user_id</text>
  <text x="215" y="325" text-anchor="middle" font-size="12" fill="#64748b">Schema enforced, strong ACID</text>
  <text x="215" y="350" text-anchor="middle" font-size="12" fill="#64748b">Postgres, MySQL</text>

  <rect x="430" y="70" width="350" height="300" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="605" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#16a34a">NoSQL: documents</text>
  <rect x="460" y="120" width="290" height="150" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="480" y="145" font-size="13" fill="#334155">{</text>
  <text x="500" y="168" font-size="13" fill="#64748b">name: "Ada",</text>
  <text x="500" y="191" font-size="13" fill="#64748b">email: "ada@x.com",</text>
  <text x="500" y="214" font-size="13" fill="#64748b">orders: [</text>
  <text x="520" y="237" font-size="12" fill="#334155">{ total: 40 }, ...</text>
  <text x="500" y="258" font-size="13" fill="#64748b">]</text>
  <text x="480" y="270" font-size="13" fill="#334155">}</text>
  <text x="605" y="300" text-anchor="middle" font-size="12" fill="#334155">Flexible shape, nest related data</text>
  <text x="605" y="325" text-anchor="middle" font-size="12" fill="#64748b">Scales horizontally, schema in app</text>
  <text x="605" y="350" text-anchor="middle" font-size="12" fill="#64748b">MongoDB, DynamoDB</text>

  <text x="410" y="392" text-anchor="middle" font-size="13" fill="#64748b">Relations &#38; strict integrity &#8594; SQL; flexible, self-contained aggregates &#8594; document</text>
</svg>