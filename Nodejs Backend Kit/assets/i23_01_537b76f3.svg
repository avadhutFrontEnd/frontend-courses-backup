<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="system-ui,Segoe UI,Roboto,sans-serif">
  <rect x="10" y="10" width="800" height="320" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="410" y="44" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">Streaming vs. Buffering the Whole File</text>

  <text x="410" y="78" text-anchor="middle" font-size="14" fill="#64748b">A 4 GB file — read all at once, or in small chunks</text>

  <!-- Buffering row -->
  <text x="60" y="120" font-size="14" font-weight="bold" fill="#334155">Buffer all</text>
  <rect x="150" y="100" width="240" height="46" rx="10" fill="#faf5ff" stroke="#9333ea"/>
  <text x="270" y="128" text-anchor="middle" font-size="13" fill="#9333ea">Load 4 GB into RAM</text>
  <path d="M400 123 H470" stroke="#9333ea" stroke-width="2" marker-end="url(#ap)"/>
  <rect x="480" y="100" width="240" height="46" rx="10" fill="#faf5ff" stroke="#9333ea"/>
  <text x="600" y="122" text-anchor="middle" font-size="12" fill="#9333ea">High memory, slow start</text>
  <text x="600" y="139" text-anchor="middle" font-size="12" fill="#9333ea">can crash the process</text>

  <!-- Streaming row -->
  <text x="60" y="222" font-size="14" font-weight="bold" fill="#334155">Stream</text>
  <rect x="150" y="196" width="120" height="46" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="210" y="224" text-anchor="middle" font-size="13" fill="#16a34a">Source</text>
  <path d="M270 219 H320" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="325" y="196" width="180" height="46" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="415" y="219" text-anchor="middle" font-size="12" fill="#16a34a">Chunks (~64 KB)</text>
  <text x="415" y="235" text-anchor="middle" font-size="11" fill="#64748b">one at a time</text>
  <path d="M505 219 H555" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <rect x="560" y="196" width="160" height="46" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="640" y="224" text-anchor="middle" font-size="13" fill="#16a34a">Destination</text>

  <text x="410" y="290" text-anchor="middle" font-size="14" fill="#334155">Constant, tiny memory — process data larger than RAM, start work immediately</text>

  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#16a34a"/></marker>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#9333ea"/></marker>
  </defs>
</svg>
