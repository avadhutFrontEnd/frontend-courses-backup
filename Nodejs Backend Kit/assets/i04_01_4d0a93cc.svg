<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="1" y="1" width="818" height="478" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Node's Threads: One JS Thread, Many Helpers</text>
  <text x="410" y="62" text-anchor="middle" font-size="13" fill="#64748b">Your JavaScript is single-threaded. libuv and the OS give Node real concurrency underneath.</text>

  <!-- JS thread -->
  <rect x="40" y="90" width="330" height="150" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="205" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Main thread (V8 + your JS)</text>
  <text x="205" y="142" text-anchor="middle" font-size="12.5" fill="#166534">runs one callback at a time</text>
  <rect x="66" y="158" width="278" height="60" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="205" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">The event loop lives here</text>
  <text x="205" y="202" text-anchor="middle" font-size="11.5" fill="#64748b">timers, poll, check, close phases</text>

  <!-- libuv -->
  <rect x="450" y="90" width="330" height="150" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="615" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">libuv (C library)</text>
  <text x="615" y="142" text-anchor="middle" font-size="12.5" fill="#1d4ed8">bridges JS to the OS</text>
  <rect x="476" y="158" width="278" height="60" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="615" y="182" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4ed8">Async I/O + a worker pool</text>
  <text x="615" y="202" text-anchor="middle" font-size="11.5" fill="#64748b">UV_THREADPOOL_SIZE (default 4)</text>

  <!-- thread pool -->
  <rect x="450" y="270" width="330" height="180" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="615" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="#c2410c">Thread pool (default 4 workers)</text>
  <g>
    <rect x="476" y="316" width="130" height="46" rx="9" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="541" y="344" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2410c">worker 1</text>
    <rect x="624" y="316" width="130" height="46" rx="9" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="689" y="344" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2410c">worker 2</text>
    <rect x="476" y="374" width="130" height="46" rx="9" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="541" y="402" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2410c">worker 3</text>
    <rect x="624" y="374" width="130" height="46" rx="9" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="689" y="402" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2410c">worker 4</text>
  </g>
  <text x="615" y="440" text-anchor="middle" font-size="11" fill="#9a3412">fs, crypto, zlib, dns.lookup run here</text>

  <!-- OS kernel -->
  <rect x="40" y="270" width="330" height="180" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="2.5"/>
  <text x="205" y="298" text-anchor="middle" font-size="15" font-weight="700" fill="#7e22ce">OS kernel (epoll/kqueue/IOCP)</text>
  <rect x="66" y="316" width="278" height="104" rx="10" fill="#ffffff" stroke="#9333ea" stroke-width="2"/>
  <text x="205" y="348" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7e22ce">Network sockets are async</text>
  <text x="205" y="370" text-anchor="middle" font-size="11.5" fill="#64748b">TCP/UDP/HTTP use kernel events,</text>
  <text x="205" y="388" text-anchor="middle" font-size="11.5" fill="#64748b">NOT the thread pool</text>
  <text x="205" y="410" text-anchor="middle" font-size="11.5" fill="#64748b">the loop waits on them in poll</text>

  <!-- connectors -->
  <g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#ah2)">
    <path d="M 370 165 L 446 165"/>
    <path d="M 615 242 L 615 266"/>
    <path d="M 450 360 L 372 360"/>
  </g>
  <defs>
    <marker id="ah2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
