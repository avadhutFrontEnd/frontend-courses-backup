<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="10" y="10" width="800" height="450" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">The middleware chain (call next to go deeper)</text>

  <rect x="120" y="80" width="580" height="330" rx="16" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="410" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">logger()  — runs first</text>

  <rect x="180" y="120" width="460" height="250" rx="14" fill="#faf5ff" stroke="#9333ea"/>
  <text x="410" y="144" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">express.json()  — parse body</text>

  <rect x="240" y="160" width="340" height="170" rx="12" fill="#fff7ed" stroke="#ea580c"/>
  <text x="410" y="184" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">authenticate()  — check token</text>

  <rect x="300" y="200" width="220" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="410" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">route handler</text>
  <text x="410" y="260" text-anchor="middle" font-size="12" fill="#64748b">res.json(data)</text>

  <text x="410" y="356" text-anchor="middle" font-size="12" fill="#64748b">each call to next() steps one layer inward</text>

  <line x1="150" y1="435" x2="410" y2="435" stroke="#16a34a" stroke-width="2" marker-end="url(#a8d)"/>
  <text x="280" y="428" text-anchor="middle" font-size="12" fill="#334155">request travels in: logger → json → auth → handler</text>
  <line x1="670" y1="435" x2="440" y2="435" stroke="#3b82f6" stroke-width="2" marker-end="url(#a8e)"/>
  <text x="585" y="428" text-anchor="middle" font-size="12" fill="#334155">response unwinds out</text>

  <defs>
    <marker id="a8d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="a8e" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3b82f6"/>
    </marker>
  </defs>
</svg>