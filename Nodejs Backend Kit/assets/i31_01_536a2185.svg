<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="10" y="10" width="800" height="450" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">Raw http vs Express: who does the work?</text>

  <rect x="45" y="76" width="350" height="360" rx="14" fill="#ffffff" stroke="#94a3b8"/>
  <text x="220" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Raw http module</text>

  <rect x="70" y="122" width="300" height="46" rx="10" fill="#fff7ed" stroke="#ea580c"/>
  <text x="220" y="150" text-anchor="middle" font-size="13" fill="#334155">You parse the URL by hand</text>

  <rect x="70" y="178" width="300" height="46" rx="10" fill="#fff7ed" stroke="#ea580c"/>
  <text x="220" y="206" text-anchor="middle" font-size="13" fill="#334155">You match method + path yourself</text>

  <rect x="70" y="234" width="300" height="46" rx="10" fill="#fff7ed" stroke="#ea580c"/>
  <text x="220" y="262" text-anchor="middle" font-size="13" fill="#334155">You buffer the body stream</text>

  <rect x="70" y="290" width="300" height="46" rx="10" fill="#fff7ed" stroke="#ea580c"/>
  <text x="220" y="318" text-anchor="middle" font-size="13" fill="#334155">You set headers and status codes</text>

  <rect x="70" y="346" width="300" height="72" rx="10" fill="#fff7ed" stroke="#ea580c"/>
  <text x="220" y="378" text-anchor="middle" font-size="13" fill="#334155">No middleware, no helpers</text>
  <text x="220" y="399" text-anchor="middle" font-size="12" fill="#64748b">full control, lots of boilerplate</text>

  <rect x="425" y="76" width="350" height="360" rx="14" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="600" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Express framework</text>

  <rect x="450" y="122" width="300" height="46" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="600" y="150" text-anchor="middle" font-size="13" fill="#334155">app.get('/users/:id', ...)</text>

  <rect x="450" y="178" width="300" height="46" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="600" y="206" text-anchor="middle" font-size="13" fill="#334155">Router matches path + method</text>

  <rect x="450" y="234" width="300" height="46" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="600" y="262" text-anchor="middle" font-size="13" fill="#334155">express.json() parses the body</text>

  <rect x="450" y="290" width="300" height="46" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="600" y="318" text-anchor="middle" font-size="13" fill="#334155">res.json(), res.status() helpers</text>

  <rect x="450" y="346" width="300" height="72" rx="10" fill="#faf5ff" stroke="#9333ea"/>
  <text x="600" y="378" text-anchor="middle" font-size="13" fill="#334155">Middleware pipeline built in</text>
  <text x="600" y="399" text-anchor="middle" font-size="12" fill="#64748b">less code, shared conventions</text>
</svg>