<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="820" height="400" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">What a test runner gives you</text>

  <rect x="40" y="80" width="230" height="230" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="155" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#16a34a">Jest</text>
  <text x="155" y="140" text-anchor="middle" font-size="12" fill="#334155">batteries included</text>
  <text x="155" y="164" text-anchor="middle" font-size="12" fill="#334155">runner + assert</text>
  <text x="155" y="188" text-anchor="middle" font-size="12" fill="#334155">mocks + coverage</text>
  <text x="155" y="212" text-anchor="middle" font-size="12" fill="#334155">snapshots</text>
  <text x="155" y="248" text-anchor="middle" font-size="12" fill="#64748b">huge ecosystem;</text>
  <text x="155" y="268" text-anchor="middle" font-size="12" fill="#64748b">slower on ESM</text>

  <rect x="295" y="80" width="230" height="230" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#3b82f6">Vitest</text>
  <text x="410" y="140" text-anchor="middle" font-size="12" fill="#334155">Jest-compatible API</text>
  <text x="410" y="164" text-anchor="middle" font-size="12" fill="#334155">native ESM + TS</text>
  <text x="410" y="188" text-anchor="middle" font-size="12" fill="#334155">Vite transform</text>
  <text x="410" y="212" text-anchor="middle" font-size="12" fill="#334155">fast watch mode</text>
  <text x="410" y="248" text-anchor="middle" font-size="12" fill="#64748b">best for Vite /</text>
  <text x="410" y="268" text-anchor="middle" font-size="12" fill="#64748b">modern TS repos</text>

  <rect x="550" y="80" width="230" height="230" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="665" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#9333ea">node:test</text>
  <text x="665" y="140" text-anchor="middle" font-size="12" fill="#334155">built into Node</text>
  <text x="665" y="164" text-anchor="middle" font-size="12" fill="#334155">zero install</text>
  <text x="665" y="188" text-anchor="middle" font-size="12" fill="#334155">node:assert</text>
  <text x="665" y="212" text-anchor="middle" font-size="12" fill="#334155">--test runner</text>
  <text x="665" y="248" text-anchor="middle" font-size="12" fill="#64748b">stable since v20;</text>
  <text x="665" y="268" text-anchor="middle" font-size="12" fill="#64748b">leaner features</text>

  <text x="410" y="352" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">All three: find tests &#183; run in isolation &#183; report pass/fail &#183; exit code</text>
  <text x="410" y="378" text-anchor="middle" font-size="13" fill="#64748b">Pick one per project; the concepts transfer between them</text>
</svg>
