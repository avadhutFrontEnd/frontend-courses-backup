<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400">
  <rect x="10" y="10" width="800" height="380" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Manual routing: match method + path</text>

  <rect x="320" y="70" width="180" height="60" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="96" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Incoming request</text>
  <text x="410" y="116" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#334155">GET /api/users?q=a</text>

  <rect x="300" y="160" width="220" height="60" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="410" y="186" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#6b21a8">new URL(req.url, base)</text>
  <text x="410" y="206" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#334155">pathname + searchParams</text>

  <line x1="410" y1="130" x2="410" y2="158" stroke="#64748b" stroke-width="2" marker-end="url(#o7)"/>
  <line x1="410" y1="220" x2="410" y2="250" stroke="#64748b" stroke-width="2" marker-end="url(#o7)"/>

  <rect x="60" y="255" width="200" height="66" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="160" y="282" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#166534">GET /api/users</text>
  <text x="160" y="304" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">list handler</text>

  <rect x="310" y="255" width="200" height="66" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="282" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#166534">POST /api/users</text>
  <text x="410" y="304" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">create handler</text>

  <rect x="560" y="255" width="200" height="66" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="660" y="282" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#991b1b">no match</text>
  <text x="660" y="304" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">404 fallthrough</text>

  <line x1="360" y1="220" x2="180" y2="253" stroke="#16a34a" stroke-width="2" marker-end="url(#o7g)"/>
  <line x1="410" y1="220" x2="410" y2="253" stroke="#16a34a" stroke-width="2" marker-end="url(#o7g)"/>
  <line x1="460" y1="220" x2="640" y2="253" stroke="#dc2626" stroke-width="2" marker-end="url(#o7r)"/>

  <text x="410" y="360" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Always send a default 404 — an unmatched request must still get a response</text>

  <defs>
    <marker id="o7" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="o7g" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="o7r" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/></marker>
  </defs>
</svg>
