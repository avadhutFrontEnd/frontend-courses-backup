<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="440" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="40" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">How Node Resolves a Specifier</text>
  <text x="410" y="66" text-anchor="middle" font-size="14" fill="#64748b">require('x') / import 'x' &#8212; three kinds of specifier</text>

  <rect x="45" y="90" width="240" height="120" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="165" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">Relative / absolute</text>
  <text x="165" y="140" text-anchor="middle" font-size="12" fill="#64748b">'./util'  '../lib'  '/abs'</text>
  <text x="60" y="166" font-size="12" fill="#334155">1. exact file</text>
  <text x="60" y="186" font-size="12" fill="#334155">2. + .js .json .node</text>
  <text x="60" y="204" font-size="12" fill="#334155">3. dir/index.js</text>

  <rect x="295" y="90" width="230" height="120" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="410" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#6b21a8">Bare specifier</text>
  <text x="410" y="140" text-anchor="middle" font-size="12" fill="#64748b">'express'  'lodash/fp'</text>
  <text x="310" y="166" font-size="12" fill="#334155">walk node_modules</text>
  <text x="310" y="186" font-size="12" fill="#334155">up the folder tree</text>
  <text x="310" y="204" font-size="12" fill="#334155">read package.json</text>

  <rect x="535" y="90" width="240" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="655" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Builtin</text>
  <text x="655" y="140" text-anchor="middle" font-size="12" fill="#64748b">'fs'  'node:path'</text>
  <text x="550" y="166" font-size="12" fill="#334155">core module,</text>
  <text x="550" y="186" font-size="12" fill="#334155">resolved instantly,</text>
  <text x="550" y="204" font-size="12" fill="#334155">no disk lookup</text>

  <text x="410" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">node_modules lookup for require('express') from /app/src/a.js</text>

  <rect x="80" y="270" width="660" height="40" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="100" y="295" font-size="13" fill="#334155" font-family="ui-monospace,monospace">/app/src/node_modules/express</text>
  <text x="640" y="295" font-size="13" fill="#dc2626">&#10007; miss</text>

  <rect x="80" y="320" width="660" height="40" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="100" y="345" font-size="13" fill="#334155" font-family="ui-monospace,monospace">/app/node_modules/express</text>
  <text x="640" y="345" font-size="13" fill="#16a34a">&#10003; found</text>

  <rect x="80" y="370" width="660" height="40" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="100" y="395" font-size="13" fill="#64748b" font-family="ui-monospace,monospace">/node_modules/express</text>
  <text x="600" y="395" font-size="13" fill="#64748b">(would continue to root)</text>
</svg>
