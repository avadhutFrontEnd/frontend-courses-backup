<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="10" y="10" width="800" height="320" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="410" y="46" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">Anatomy of a route</text>

  <rect x="60" y="90" width="150" height="80" rx="12" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="135" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">app.get</text>
  <text x="135" y="147" text-anchor="middle" font-size="12" fill="#64748b">HTTP method</text>

  <rect x="240" y="90" width="230" height="80" rx="12" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="355" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">'/users/:id'</text>
  <text x="355" y="147" text-anchor="middle" font-size="12" fill="#64748b">path pattern (:id is a param)</text>

  <rect x="500" y="90" width="260" height="80" rx="12" fill="#faf5ff" stroke="#9333ea"/>
  <text x="630" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">(req, res) =&gt; { ... }</text>
  <text x="630" y="147" text-anchor="middle" font-size="12" fill="#64748b">handler function</text>

  <rect x="120" y="210" width="220" height="88" rx="12" fill="#fff7ed" stroke="#ea580c"/>
  <text x="230" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">req.params.id</text>
  <text x="230" y="262" text-anchor="middle" font-size="12" fill="#64748b">from :id in the path</text>
  <text x="230" y="282" text-anchor="middle" font-size="12" fill="#64748b">e.g. /users/42 =&gt; "42"</text>

  <rect x="470" y="210" width="220" height="88" rx="12" fill="#fff7ed" stroke="#ea580c"/>
  <text x="580" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">req.query.sort</text>
  <text x="580" y="262" text-anchor="middle" font-size="12" fill="#64748b">from ?sort=asc</text>
  <text x="580" y="282" text-anchor="middle" font-size="12" fill="#64748b">after the ? in the URL</text>

  <line x1="230" y1="172" x2="230" y2="208" stroke="#94a3b8" stroke-width="2" marker-end="url(#a8b)"/>
  <line x1="580" y1="172" x2="580" y2="208" stroke="#94a3b8" stroke-width="2" marker-end="url(#a8b)"/>

  <defs>
    <marker id="a8b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>