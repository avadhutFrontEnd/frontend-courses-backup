<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400">
  <rect x="10" y="10" width="800" height="380" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Salted, slow password hashing</text>

  <rect x="40" y="85" width="150" height="60" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="115" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">Plain password</text>
  <text x="115" y="132" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#334155">&quot;hunter2&quot;</text>

  <rect x="230" y="85" width="150" height="60" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="305" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#6b21a8">+ random salt</text>
  <text x="305" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">unique per user</text>

  <rect x="420" y="85" width="180" height="60" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="510" y="108" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#991b1b">slow KDF (cost)</text>
  <text x="510" y="130" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">bcrypt / argon2</text>

  <rect x="640" y="85" width="140" height="60" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="710" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#166534">stored hash</text>
  <text x="710" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">DB column</text>

  <line x1="190" y1="115" x2="228" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#e11)"/>
  <line x1="380" y1="115" x2="418" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#e11)"/>
  <line x1="600" y1="115" x2="638" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#e11)"/>

  <rect x="120" y="185" width="580" height="55" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="410" y="209" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#334155">$2b$12$Nq9k...saltandhash...  (algo $ cost $ salt+digest)</text>
  <text x="410" y="229" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">The salt is stored inside the hash string — no separate column needed</text>

  <rect x="120" y="265" width="270" height="70" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="255" y="292" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#166534">bcrypt / argon2</text>
  <text x="255" y="312" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">slow + salted + tunable</text>
  <text x="255" y="328" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">resists GPU brute force</text>

  <rect x="430" y="265" width="270" height="70" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="565" y="292" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#991b1b">MD5 / SHA-256 / plain</text>
  <text x="565" y="312" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">fast + no salt = billions/sec</text>
  <text x="565" y="328" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">cracked with rainbow tables</text>

  <defs>
    <marker id="e11" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
  </defs>
</svg>
