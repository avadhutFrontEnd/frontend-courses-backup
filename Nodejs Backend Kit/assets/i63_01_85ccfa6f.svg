<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="1" y="1" width="818" height="468" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Graceful Shutdown on SIGTERM</text>
  <text x="410" y="62" text-anchor="middle" font-size="13" fill="#64748b">Stop taking new work, finish what's in flight, close resources, then exit 0.</text>

  <!-- steps -->
  <rect x="60" y="92" width="700" height="52" rx="11" fill="#faf5ff" stroke="#9333ea" stroke-width="2.2"/>
  <text x="82" y="124" font-size="14" font-weight="700" fill="#7e22ce">1. Orchestrator sends SIGTERM (rolling deploy, scale-down, crash of a pod)</text>

  <rect x="60" y="156" width="700" height="52" rx="11" fill="#fff7ed" stroke="#ea580c" stroke-width="2.2"/>
  <text x="82" y="188" font-size="14" font-weight="700" fill="#c2410c">2. Flip readiness probe to NOT ready — load balancer stops routing new requests</text>

  <rect x="60" y="220" width="700" height="52" rx="11" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.2"/>
  <text x="82" y="252" font-size="14" font-weight="700" fill="#1d4ed8">3. server.close() — stop accepting connections, let in-flight requests finish</text>

  <rect x="60" y="284" width="700" height="52" rx="11" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2"/>
  <text x="82" y="316" font-size="14" font-weight="700" fill="#166534">4. Close DB pool, Redis, message consumers, flush logs and metrics</text>

  <rect x="60" y="348" width="700" height="52" rx="11" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.2"/>
  <text x="82" y="380" font-size="14" font-weight="700" fill="#166534">5. process.exit(0) — or let the loop drain naturally</text>

  <!-- safety timer -->
  <rect x="60" y="414" width="700" height="44" rx="11" fill="#fef2f2" stroke="#dc2626" stroke-width="2.2"/>
  <text x="410" y="441" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">Safety net: a forced-exit timer (e.g. 10s) so a stuck request can't hang the shutdown forever</text>

  <!-- down arrows -->
  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#a3)">
    <line x1="410" y1="144" x2="410" y2="154"/>
    <line x1="410" y1="208" x2="410" y2="218"/>
    <line x1="410" y1="272" x2="410" y2="282"/>
    <line x1="410" y1="336" x2="410" y2="346"/>
  </g>
  <defs>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="4" refY="7" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
