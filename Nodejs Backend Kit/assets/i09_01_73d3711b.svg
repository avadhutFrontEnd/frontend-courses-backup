<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="420" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="40" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">CommonJS vs ES Modules</text>
  <text x="410" y="66" text-anchor="middle" font-size="14" fill="#64748b">Two module systems that coexist in modern Node</text>

  <rect x="45" y="90" width="350" height="300" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="220" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">CommonJS (CJS)</text>
  <text x="65" y="150" font-size="13" fill="#334155">Files: .js (default) or .cjs</text>
  <text x="65" y="176" font-size="13" fill="#334155">Load: require() &#8212; synchronous</text>
  <text x="65" y="202" font-size="13" fill="#334155">Export: module.exports</text>
  <text x="65" y="228" font-size="13" fill="#334155">Timing: resolved at runtime</text>
  <text x="65" y="254" font-size="13" fill="#334155">Bindings: copied values</text>
  <text x="65" y="280" font-size="13" fill="#334155">__dirname / __filename: yes</text>
  <text x="65" y="306" font-size="13" fill="#334155">Top-level await: no</text>
  <text x="65" y="332" font-size="13" fill="#334155">Tree-shakeable: hard</text>
  <text x="65" y="366" font-size="12" fill="#64748b">Node&#8217;s original system since 2009</text>

  <rect x="425" y="90" width="350" height="300" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">ES Modules (ESM)</text>
  <text x="445" y="150" font-size="13" fill="#334155">Files: .mjs or "type":"module"</text>
  <text x="445" y="176" font-size="13" fill="#334155">Load: import &#8212; asynchronous</text>
  <text x="445" y="202" font-size="13" fill="#334155">Export: export / export default</text>
  <text x="445" y="228" font-size="13" fill="#334155">Timing: statically analysed</text>
  <text x="445" y="254" font-size="13" fill="#334155">Bindings: live references</text>
  <text x="445" y="280" font-size="13" fill="#334155">import.meta.url instead</text>
  <text x="445" y="306" font-size="13" fill="#334155">Top-level await: yes</text>
  <text x="445" y="332" font-size="13" fill="#334155">Tree-shakeable: yes</text>
  <text x="445" y="366" font-size="12" fill="#64748b">The ECMAScript standard, since Node 12+</text>
</svg>
