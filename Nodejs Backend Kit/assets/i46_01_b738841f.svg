<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420">
  <rect x="10" y="10" width="800" height="400" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Anatomy of a JSON Web Token</text>

  <text x="410" y="78" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#334155">xxxxx . yyyyy . zzzzz</text>

  <rect x="40" y="100" width="230" height="120" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="155" y="128" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#991b1b">1. Header</text>
  <text x="155" y="152" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#334155">{ &quot;alg&quot;: &quot;HS256&quot;,</text>
  <text x="155" y="170" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#334155">&quot;typ&quot;: &quot;JWT&quot; }</text>
  <text x="155" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">algorithm + type</text>

  <rect x="295" y="100" width="230" height="120" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="410" y="128" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#6b21a8">2. Payload</text>
  <text x="410" y="152" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#334155">{ &quot;sub&quot;: &quot;u_42&quot;,</text>
  <text x="410" y="170" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#334155">&quot;role&quot;: &quot;admin&quot;, &quot;exp&quot;: ... }</text>
  <text x="410" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">claims (public, not encrypted)</text>

  <rect x="550" y="100" width="230" height="120" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="665" y="128" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#166534">3. Signature</text>
  <text x="665" y="154" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10" fill="#334155">HMACSHA256(</text>
  <text x="665" y="170" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10" fill="#334155">b64(header)+&quot;.&quot;+b64(payload),</text>
  <text x="665" y="186" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="10" fill="#334155">secret)</text>
  <text x="665" y="208" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">proves integrity</text>

  <rect x="120" y="250" width="580" height="70" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="278" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">Each part is Base64URL-encoded, joined with dots</text>
  <text x="410" y="302" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Base64URL is NOT encryption — anyone can read the payload</text>

  <text x="410" y="360" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#991b1b">Never put passwords or secrets in the payload</text>
  <text x="410" y="386" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">The signature guarantees the token was not altered — it does not hide the contents</text>
</svg>
