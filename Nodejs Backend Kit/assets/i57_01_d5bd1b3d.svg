<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="820" height="400" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">Test doubles: spy, stub, mock</text>

  <rect x="40" y="80" width="230" height="150" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="155" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#16a34a">Spy</text>
  <text x="155" y="142" text-anchor="middle" font-size="12" fill="#334155">records how a</text>
  <text x="155" y="162" text-anchor="middle" font-size="12" fill="#334155">function was called</text>
  <text x="155" y="192" text-anchor="middle" font-size="12" fill="#64748b">real code still runs;</text>
  <text x="155" y="212" text-anchor="middle" font-size="12" fill="#64748b">you observe calls</text>

  <rect x="295" y="80" width="230" height="150" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#3b82f6">Stub</text>
  <text x="410" y="142" text-anchor="middle" font-size="12" fill="#334155">replaces a function</text>
  <text x="410" y="162" text-anchor="middle" font-size="12" fill="#334155">with a canned return</text>
  <text x="410" y="192" text-anchor="middle" font-size="12" fill="#64748b">controls inputs from</text>
  <text x="410" y="212" text-anchor="middle" font-size="12" fill="#64748b">a dependency</text>

  <rect x="550" y="80" width="230" height="150" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="665" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#9333ea">Mock</text>
  <text x="665" y="142" text-anchor="middle" font-size="12" fill="#334155">stub + built-in</text>
  <text x="665" y="162" text-anchor="middle" font-size="12" fill="#334155">expectations</text>
  <text x="665" y="192" text-anchor="middle" font-size="12" fill="#64748b">asserts it was called</text>
  <text x="665" y="212" text-anchor="middle" font-size="12" fill="#64748b">the right way</text>

  <rect x="120" y="270" width="580" height="90" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Jest blurs them: jest.fn() is all three</text>
  <text x="410" y="326" text-anchor="middle" font-size="12" fill="#334155">it spies (calls array), stubs (mockReturnValue),</text>
  <text x="410" y="346" text-anchor="middle" font-size="12" fill="#334155">and verifies (expect(fn).toHaveBeenCalledWith)</text>
</svg>
