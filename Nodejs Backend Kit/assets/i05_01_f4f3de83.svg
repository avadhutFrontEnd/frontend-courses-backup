<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="1" y="1" width="818" height="438" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">nextTick vs Promise vs Timer vs Immediate</text>
  <text x="410" y="62" text-anchor="middle" font-size="13" fill="#64748b">Priority from a running callback: nextTick first, then promises, then macrotask phases.</text>

  <!-- lane 1 -->
  <rect x="40" y="88" width="740" height="70" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <circle cx="78" cy="123" r="16" fill="#16a34a"/>
  <text x="78" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="112" y="118" font-size="15" font-weight="700" fill="#166534">process.nextTick queue</text>
  <text x="112" y="140" font-size="12" fill="#166534">drains completely before anything else, even Promises</text>

  <!-- lane 2 -->
  <rect x="40" y="170" width="740" height="70" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2.5"/>
  <circle cx="78" cy="205" r="16" fill="#9333ea"/>
  <text x="78" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="112" y="200" font-size="15" font-weight="700" fill="#7e22ce">Promise microtask queue</text>
  <text x="112" y="222" font-size="12" fill="#7e22ce">.then / await / queueMicrotask — drains after nextTick</text>

  <!-- lane 3 -->
  <rect x="40" y="252" width="360" height="76" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <circle cx="78" cy="290" r="16" fill="#ea580c"/>
  <text x="78" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3a</text>
  <text x="112" y="284" font-size="14" font-weight="700" fill="#c2410c">timers phase</text>
  <text x="112" y="305" font-size="12" fill="#c2410c">setTimeout(fn, 0)</text>

  <!-- lane 3b -->
  <rect x="420" y="252" width="360" height="76" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
  <circle cx="458" cy="290" r="16" fill="#3b82f6"/>
  <text x="458" y="295" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3b</text>
  <text x="492" y="284" font-size="14" font-weight="700" fill="#1d4ed8">check phase</text>
  <text x="492" y="305" font-size="12" fill="#1d4ed8">setImmediate(fn)</text>

  <text x="410" y="356" text-anchor="middle" font-size="12.5" fill="#64748b">3a and 3b are macrotasks — their relative order depends on where you are in the loop.</text>
  <text x="410" y="378" text-anchor="middle" font-size="12.5" fill="#64748b">Both lane 1 and lane 2 fully drain between EVERY macrotask callback.</text>
  <text x="410" y="408" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Rule: microtasks (1 then 2) always beat macrotasks (3).</text>
</svg>
