<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="380" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="40" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">The "exports" Field &amp; Conditions</text>
  <text x="410" y="66" text-anchor="middle" font-size="14" fill="#64748b">A package controls exactly what and how it can be imported</text>

  <rect x="45" y="90" width="330" height="250" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="210" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#6b21a8">package.json</text>
  <text x="65" y="146" font-size="12.5" fill="#334155" font-family="ui-monospace,monospace">"exports": {</text>
  <text x="80" y="168" font-size="12.5" fill="#334155" font-family="ui-monospace,monospace">".": {</text>
  <text x="95" y="190" font-size="12.5" fill="#334155" font-family="ui-monospace,monospace">"import": "./esm/index.js",</text>
  <text x="95" y="212" font-size="12.5" fill="#334155" font-family="ui-monospace,monospace">"require": "./cjs/index.js",</text>
  <text x="95" y="234" font-size="12.5" fill="#334155" font-family="ui-monospace,monospace">"types": "./index.d.ts"</text>
  <text x="80" y="256" font-size="12.5" fill="#334155" font-family="ui-monospace,monospace">},</text>
  <text x="80" y="278" font-size="12.5" fill="#334155" font-family="ui-monospace,monospace">"./utils": "./lib/utils.js"</text>
  <text x="65" y="300" font-size="12.5" fill="#334155" font-family="ui-monospace,monospace">}</text>
  <text x="210" y="328" text-anchor="middle" font-size="12" fill="#dc2626">Everything else is now private</text>

  <rect x="415" y="90" width="360" height="115" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="595" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">import 'pkg'</text>
  <text x="435" y="146" font-size="12.5" fill="#334155">matches "." + condition "import"</text>
  <text x="435" y="172" font-size="12.5" fill="#334155" font-family="ui-monospace,monospace">&#8594; ./esm/index.js</text>
  <text x="435" y="194" font-size="12" fill="#64748b">require('pkg') &#8594; ./cjs/index.js</text>

  <rect x="415" y="220" width="360" height="60" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="435" y="248" font-size="13" fill="#334155" font-family="ui-monospace,monospace">import 'pkg/utils' &#8594; ./lib/utils.js</text>
  <text x="435" y="270" font-size="12" fill="#64748b">only listed subpaths are reachable</text>

  <rect x="415" y="295" width="360" height="45" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="435" y="323" font-size="13" fill="#991b1b" font-family="ui-monospace,monospace">import 'pkg/lib/secret' &#8594; blocked</text>
</svg>
