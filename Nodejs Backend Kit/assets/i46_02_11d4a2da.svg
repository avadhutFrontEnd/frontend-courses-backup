<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440">
  <rect x="10" y="10" width="800" height="420" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Access + refresh token flow</text>

  <rect x="40" y="80" width="170" height="60" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="125" y="106" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Client</text>
  <text x="125" y="126" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">app / browser</text>

  <rect x="610" y="80" width="170" height="60" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="695" y="106" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534">Auth server</text>
  <text x="695" y="126" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">issues + verifies</text>

  <line x1="210" y1="100" x2="608" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#c11)"/>
  <text x="410" y="93" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">1. login (credentials)</text>
  <line x1="608" y1="128" x2="212" y2="128" stroke="#16a34a" stroke-width="2" marker-end="url(#c11g)"/>
  <text x="410" y="122" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#166534">2. access (15m) + refresh (7d)</text>

  <rect x="120" y="175" width="580" height="55" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="410" y="200" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#6b21a8">3. Call APIs with the short-lived access token</text>
  <text x="410" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">Authorization: Bearer &lt;access&gt; — verified by signature, no DB hit</text>

  <rect x="120" y="250" width="580" height="55" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="410" y="275" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#991b1b">4. Access token expires -&gt; 401</text>
  <text x="410" y="295" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">Client stops using it; time to refresh</text>

  <rect x="120" y="325" width="580" height="70" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="352" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#166534">5. POST /refresh with refresh token</text>
  <text x="410" y="374" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">Server checks it against a store, ROTATES it, issues a new access token</text>
  <text x="410" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">Refresh tokens are revocable — logout / theft detection deletes the row</text>

  <defs>
    <marker id="c11" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="c11g" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
