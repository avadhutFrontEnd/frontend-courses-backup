<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360">
  <rect x="10" y="10" width="800" height="340" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Authentication vs Authorization</text>

  <rect x="40" y="80" width="345" height="230" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="212" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#166534">Authentication (AuthN)</text>
  <text x="212" y="138" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">&quot;Who are you?&quot;</text>
  <text x="212" y="168" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Verify identity via credentials</text>
  <text x="212" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">password, OTP, OAuth, passkey</text>
  <text x="212" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Result: a proven identity</text>
  <text x="212" y="242" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">(a user id in a session or token)</text>
  <text x="212" y="278" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">Happens first — at login</text>

  <rect x="435" y="80" width="345" height="230" rx="16" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="607" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="bold" fill="#6b21a8">Authorization (AuthZ)</text>
  <text x="607" y="138" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#334155">&quot;What may you do?&quot;</text>
  <text x="607" y="168" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Check permissions for a resource</text>
  <text x="607" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">roles, scopes, ownership, ACLs</text>
  <text x="607" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Result: allow or 403 Forbidden</text>
  <text x="607" y="242" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Enforced on every request</text>
  <text x="607" y="278" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#6b21a8">Happens after — on each call</text>

  <line x1="385" y1="195" x2="435" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#a11)"/>
  <text x="410" y="330" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">401 Unauthorized = not authenticated. 403 Forbidden = authenticated but not authorized.</text>

  <defs>
    <marker id="a11" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
