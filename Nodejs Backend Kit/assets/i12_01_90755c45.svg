<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="340" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="40" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">npm Script Lifecycle Hooks</text>
  <text x="410" y="66" text-anchor="middle" font-size="14" fill="#64748b">Running npm run build fires three scripts in order</text>

  <rect x="60" y="100" width="200" height="90" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="160" y="135" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">prebuild</text>
  <text x="160" y="162" text-anchor="middle" font-size="12" fill="#64748b">runs first</text>
  <text x="160" y="180" text-anchor="middle" font-size="12" fill="#64748b">if it exists</text>

  <rect x="310" y="100" width="200" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="135" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">build</text>
  <text x="410" y="162" text-anchor="middle" font-size="12" fill="#64748b">the script you</text>
  <text x="410" y="180" text-anchor="middle" font-size="12" fill="#64748b">actually named</text>

  <rect x="560" y="100" width="200" height="90" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="660" y="135" text-anchor="middle" font-size="16" font-weight="700" fill="#6b21a8">postbuild</text>
  <text x="660" y="162" text-anchor="middle" font-size="12" fill="#64748b">runs last</text>
  <text x="660" y="180" text-anchor="middle" font-size="12" fill="#64748b">if it exists</text>

  <path d="M262 145 L306 145" stroke="#64748b" stroke-width="2" marker-end="url(#b)"/>
  <path d="M512 145 L556 145" stroke="#64748b" stroke-width="2" marker-end="url(#b)"/>

  <rect x="60" y="225" width="700" height="80" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="80" y="252" font-size="14" font-weight="700" fill="#0f172a">Reserved lifecycle names</text>
  <text x="80" y="278" font-size="12.5" fill="#334155">install &#8594; preinstall / postinstall &#160;&#160; publish &#8594; prepublishOnly, prepare</text>
  <text x="80" y="298" font-size="12" fill="#dc2626">postinstall runs automatically after npm install &#8212; a real supply-chain risk</text>

  <defs>
    <marker id="b" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
