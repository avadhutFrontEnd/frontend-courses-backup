<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="1" y="1" width="818" height="398" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Inside One Phase: Drain the Queue</text>
  <text x="410" y="62" text-anchor="middle" font-size="13" fill="#64748b">A phase runs its callbacks until the queue empties or a hard limit is hit, then moves on.</text>

  <!-- phase box -->
  <rect x="40" y="96" width="740" height="150" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="64" y="126" font-size="15" font-weight="700" fill="#166534">poll phase</text>

  <!-- queue items -->
  <g>
    <rect x="70" y="146" width="120" height="70" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="130" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">cb A</text>
    <text x="130" y="200" text-anchor="middle" font-size="11" fill="#64748b">fs.read done</text>

    <rect x="210" y="146" width="120" height="70" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="270" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">cb B</text>
    <text x="270" y="200" text-anchor="middle" font-size="11" fill="#64748b">http req</text>

    <rect x="350" y="146" width="120" height="70" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="410" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">cb C</text>
    <text x="410" y="200" text-anchor="middle" font-size="11" fill="#64748b">socket data</text>

    <rect x="490" y="146" width="120" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="550" y="184" text-anchor="middle" font-size="13" fill="#64748b">... more</text>
  </g>

  <text x="700" y="188" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">empty ➜</text>

  <!-- microtask drain -->
  <rect x="40" y="272" width="360" height="96" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="220" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#7e22ce">After EACH callback:</text>
  <text x="220" y="322" text-anchor="middle" font-size="12.5" fill="#7e22ce">drain process.nextTick queue,</text>
  <text x="220" y="342" text-anchor="middle" font-size="12.5" fill="#7e22ce">then the Promise microtask queue</text>

  <!-- next phase -->
  <rect x="420" y="272" width="360" height="96" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="300" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">Queue empty ➜ next phase</text>
  <text x="600" y="322" text-anchor="middle" font-size="12.5" fill="#1d4ed8">poll ➜ check ➜ close ➜ timers</text>
  <text x="600" y="342" text-anchor="middle" font-size="12.5" fill="#1d4ed8">(loop wraps around again)</text>
</svg>
