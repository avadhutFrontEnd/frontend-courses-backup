<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="1" y="1" width="818" height="468" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Multi-Stage Docker Build for Node</text>
  <text x="410" y="62" text-anchor="middle" font-size="13" fill="#64748b">Build in a fat stage; copy only the runtime artifacts into a slim final image.</text>

  <!-- build stage -->
  <rect x="36" y="90" width="360" height="330" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="216" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">Stage 1: builder</text>
  <text x="216" y="138" text-anchor="middle" font-size="11" fill="#3b82f6">FROM node:20 — has toolchain</text>
  <g>
    <rect x="60" y="156" width="312" height="46" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="76" y="184" font-size="12" font-weight="700" fill="#1d4ed8">COPY package*.json  (cache layer)</text>
    <rect x="60" y="210" width="312" height="46" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="76" y="238" font-size="12" font-weight="700" fill="#1d4ed8">npm ci  (all deps + dev)</text>
    <rect x="60" y="264" width="312" height="46" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="76" y="292" font-size="12" font-weight="700" fill="#1d4ed8">COPY . . then npm run build</text>
    <rect x="60" y="318" width="312" height="46" rx="9" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="76" y="346" font-size="12" font-weight="700" fill="#1d4ed8">produce dist/ + prod node_modules</text>
  </g>
  <text x="216" y="398" text-anchor="middle" font-size="11" fill="#3b82f6">large: compilers, dev deps, source</text>

  <!-- arrow -->
  <line x1="396" y1="255" x2="424" y2="255" stroke="#475569" stroke-width="2.5" marker-end="url(#a2)"/>
  <text x="410" y="245" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">COPY</text>

  <!-- runtime stage -->
  <rect x="424" y="90" width="360" height="330" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="604" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#166534">Stage 2: runtime</text>
  <text x="604" y="138" text-anchor="middle" font-size="11" fill="#166534">FROM node:20-slim — tiny base</text>
  <g>
    <rect x="448" y="156" width="312" height="46" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
    <text x="464" y="184" font-size="12" font-weight="700" fill="#166534">COPY --from=builder dist/ node_modules/</text>
    <rect x="448" y="210" width="312" height="46" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
    <text x="464" y="238" font-size="12" font-weight="700" fill="#166534">USER node  (drop root)</text>
    <rect x="448" y="264" width="312" height="46" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
    <text x="464" y="292" font-size="12" font-weight="700" fill="#166534">ENV NODE_ENV=production</text>
    <rect x="448" y="318" width="312" height="46" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
    <text x="464" y="346" font-size="12" font-weight="700" fill="#166534">CMD [node, dist/server.js]</text>
  </g>
  <text x="604" y="398" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">small, no build tools, non-root</text>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
