<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="820" height="340" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">Hash vs HMAC vs password hash</text>

  <rect x="40" y="75" width="240" height="215" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="160" y="103" text-anchor="middle" font-size="15" font-weight="bold" fill="#3b82f6">createHash (SHA-256)</text>
  <rect x="70" y="120" width="180" height="38" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="160" y="144" text-anchor="middle" font-size="13" fill="#334155">integrity check</text>
  <rect x="70" y="170" width="180" height="38" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="160" y="194" text-anchor="middle" font-size="13" fill="#334155">one-way digest</text>
  <text x="160" y="250" text-anchor="middle" font-size="12" fill="#64748b">NOT for passwords</text>
  <text x="160" y="270" text-anchor="middle" font-size="12" fill="#64748b">no secret key</text>

  <rect x="290" y="75" width="240" height="215" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="410" y="103" text-anchor="middle" font-size="15" font-weight="bold" fill="#9333ea">createHmac</text>
  <rect x="320" y="120" width="180" height="38" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="410" y="144" text-anchor="middle" font-size="13" fill="#334155">hash + secret key</text>
  <rect x="320" y="170" width="180" height="38" rx="8" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="410" y="194" text-anchor="middle" font-size="13" fill="#334155">proves authenticity</text>
  <text x="410" y="250" text-anchor="middle" font-size="12" fill="#64748b">webhooks, tokens</text>
  <text x="410" y="270" text-anchor="middle" font-size="12" fill="#64748b">verify with timingSafe</text>

  <rect x="540" y="75" width="240" height="215" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="103" text-anchor="middle" font-size="15" font-weight="bold" fill="#16a34a">scrypt / argon2</text>
  <rect x="570" y="120" width="180" height="38" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="660" y="144" text-anchor="middle" font-size="13" fill="#334155">slow on purpose</text>
  <rect x="570" y="170" width="180" height="38" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="660" y="194" text-anchor="middle" font-size="13" fill="#334155">per-user salt</text>
  <text x="660" y="250" text-anchor="middle" font-size="12" fill="#64748b">store passwords here</text>
  <text x="660" y="270" text-anchor="middle" font-size="12" fill="#64748b">resists brute force</text>

  <text x="410" y="322" text-anchor="middle" font-size="13" fill="#64748b">Pick the tool by the job &#8212; fast digests and password hashing are opposites</text>
</svg>
