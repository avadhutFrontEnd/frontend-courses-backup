<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="10" y="10" width="800" height="340" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="45" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">EventEmitter: emit fans out to listeners</text>

  <rect x="60" y="130" width="200" height="90" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="160" y="165" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">emitter</text>
  <text x="160" y="190" text-anchor="middle" font-size="12" fill="#64748b">emit('data', payload)</text>

  <rect x="560" y="70" width="200" height="60" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="660" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">listener A</text>
  <text x="660" y="118" text-anchor="middle" font-size="11" fill="#64748b">on('data', ...)</text>

  <rect x="560" y="150" width="200" height="60" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="660" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">listener B</text>
  <text x="660" y="198" text-anchor="middle" font-size="11" fill="#64748b">on('data', ...)</text>

  <rect x="560" y="230" width="200" height="60" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="660" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">listener C</text>
  <text x="660" y="278" text-anchor="middle" font-size="11" fill="#64748b">once('data', ...)</text>

  <line x1="260" y1="165" x2="558" y2="100" stroke="#334155" stroke-width="2" marker-end="url(#a4)"/>
  <line x1="260" y1="175" x2="558" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#a4)"/>
  <line x1="260" y1="185" x2="558" y2="260" stroke="#334155" stroke-width="2" marker-end="url(#a4)"/>

  <text x="410" y="325" text-anchor="middle" font-size="12" fill="#64748b">Listeners run synchronously, in registration order, on one emit.</text>

  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
