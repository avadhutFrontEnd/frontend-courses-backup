<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="10" y="10" width="800" height="320" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="45" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">Promise callbacks run as microtasks</text>

  <rect x="60" y="90" width="220" height="180" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="170" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Call stack</text>
  <text x="170" y="146" text-anchor="middle" font-size="12" fill="#64748b">sync code runs</text>
  <text x="170" y="166" text-anchor="middle" font-size="12" fill="#64748b">to completion first</text>

  <rect x="300" y="90" width="220" height="180" rx="14" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="410" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Microtask queue</text>
  <text x="410" y="146" text-anchor="middle" font-size="12" fill="#64748b">.then / await bodies</text>
  <text x="410" y="166" text-anchor="middle" font-size="12" fill="#64748b">queueMicrotask</text>
  <text x="410" y="192" text-anchor="middle" font-size="12" fill="#9333ea" font-weight="bold">drains fully</text>
  <text x="410" y="212" text-anchor="middle" font-size="12" fill="#9333ea" font-weight="bold">before timers</text>

  <rect x="540" y="90" width="220" height="180" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="650" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Macrotask queue</text>
  <text x="650" y="146" text-anchor="middle" font-size="12" fill="#64748b">setTimeout, I/O</text>
  <text x="650" y="166" text-anchor="middle" font-size="12" fill="#64748b">setImmediate</text>
  <text x="650" y="192" text-anchor="middle" font-size="12" fill="#3b82f6" font-weight="bold">runs after</text>
  <text x="650" y="212" text-anchor="middle" font-size="12" fill="#3b82f6" font-weight="bold">microtasks</text>

  <line x1="280" y1="180" x2="298" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#a4)"/>
  <line x1="520" y1="180" x2="538" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#a4)"/>
  <text x="410" y="305" text-anchor="middle" font-size="12" fill="#64748b">Order: sync → all microtasks → one macrotask → microtasks again…</text>

  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
</svg>
