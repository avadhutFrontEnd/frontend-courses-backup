<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440">
  <rect x="10" y="10" width="800" height="420" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Monolith vs Microservices</text>

  <rect x="40" y="70" width="345" height="340" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="212" y="100" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">Monolith</text>
  <text x="212" y="122" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">one deployable process</text>

  <rect x="80" y="140" width="265" height="150" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="100" y="160" width="105" height="45" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="152" y="187" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">Users</text>
  <rect x="220" y="160" width="105" height="45" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="272" y="187" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">Orders</text>
  <rect x="100" y="225" width="105" height="45" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="152" y="252" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">Payments</text>
  <rect x="220" y="225" width="105" height="45" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="272" y="252" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">Email</text>

  <text x="212" y="320" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">In-process calls, one DB, one deploy</text>
  <text x="212" y="344" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">+ Simple, fast, easy to debug</text>
  <text x="212" y="372" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">- Scales as one unit, coupled</text>

  <rect x="435" y="70" width="345" height="340" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="607" y="100" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#166534">Microservices</text>
  <text x="607" y="122" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">many small deployables</text>

  <rect x="475" y="150" width="120" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="535" y="172" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">Users svc</text>
  <text x="535" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#94a3b8">own DB</text>
  <rect x="620" y="150" width="120" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="680" y="172" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">Orders svc</text>
  <text x="680" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#94a3b8">own DB</text>
  <rect x="475" y="212" width="120" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="535" y="234" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">Payments svc</text>
  <text x="535" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#94a3b8">own DB</text>
  <rect x="620" y="212" width="120" height="48" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="680" y="234" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">Email svc</text>
  <text x="680" y="250" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#94a3b8">own DB</text>

  <text x="607" y="320" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Talk over network (HTTP/gRPC/queue)</text>
  <text x="607" y="344" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">+ Scale + deploy independently</text>
  <text x="607" y="372" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">- Network, ops, data consistency</text>
</svg>
