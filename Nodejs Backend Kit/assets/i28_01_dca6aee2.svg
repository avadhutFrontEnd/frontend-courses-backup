<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420">
  <rect x="10" y="10" width="800" height="400" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Anatomy of an HTTP request</text>

  <rect x="40" y="70" width="360" height="310" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="220" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e3a8a">Raw bytes on the wire</text>
  <text x="60" y="132" font-family="Consolas, monospace" font-size="13" fill="#0f172a">POST /users?active=1 HTTP/1.1</text>
  <text x="60" y="158" font-family="Consolas, monospace" font-size="13" fill="#334155">Host: api.example.com</text>
  <text x="60" y="180" font-family="Consolas, monospace" font-size="13" fill="#334155">Content-Type: application/json</text>
  <text x="60" y="202" font-family="Consolas, monospace" font-size="13" fill="#334155">Content-Length: 27</text>
  <text x="60" y="238" font-family="Consolas, monospace" font-size="13" fill="#334155">(blank line)</text>
  <text x="60" y="272" font-family="Consolas, monospace" font-size="13" fill="#166534">{"name":"Ada","admin":true}</text>
  <text x="60" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">start line, then headers, blank</text>
  <text x="60" y="358" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">line, then optional body</text>

  <rect x="440" y="70" width="340" height="310" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="610" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#166534">Node IncomingMessage</text>
  <text x="460" y="130" font-family="Consolas, monospace" font-size="13" fill="#0f172a">req.method  =&gt; 'POST'</text>
  <text x="460" y="156" font-family="Consolas, monospace" font-size="13" fill="#0f172a">req.url     =&gt; '/users?active=1'</text>
  <text x="460" y="182" font-family="Consolas, monospace" font-size="13" fill="#0f172a">req.headers =&gt; { host, ... }</text>
  <text x="460" y="208" font-family="Consolas, monospace" font-size="13" fill="#0f172a">req.httpVersion =&gt; '1.1'</text>
  <text x="460" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#6b21a8">Body is a stream:</text>
  <text x="460" y="272" font-family="Consolas, monospace" font-size="12" fill="#334155">req.on('data', chunk =&gt; ...)</text>
  <text x="460" y="294" font-family="Consolas, monospace" font-size="12" fill="#334155">req.on('end', () =&gt; ...)</text>
  <text x="460" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">Node parses the start line and</text>
  <text x="460" y="354" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">headers; the body stays raw</text>

  <line x1="400" y1="225" x2="438" y2="225" stroke="#64748b" stroke-width="2" marker-end="url(#r7)"/>
  <text x="419" y="216" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b">parse</text>

  <defs>
    <marker id="r7" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
