<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400">
  <rect x="10" y="10" width="800" height="380" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Work queue vs Pub/Sub</text>

  <rect x="40" y="70" width="345" height="300" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="212" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e40af">Work queue (competing)</text>
  <text x="212" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">each message goes to ONE consumer</text>

  <rect x="80" y="140" width="90" height="44" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="125" y="167" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">Producer</text>
  <rect x="255" y="140" width="90" height="44" rx="8" fill="#ede9fe" stroke="#9333ea" stroke-width="1.5"/>
  <text x="300" y="167" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">Queue</text>
  <line x1="170" y1="162" x2="252" y2="162" stroke="#64748b" stroke-width="2" marker-end="url(#p15)"/>

  <rect x="80" y="230" width="130" height="42" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="145" y="256" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">Worker A</text>
  <rect x="230" y="230" width="130" height="42" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="295" y="256" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">Worker B</text>
  <line x1="290" y1="184" x2="160" y2="228" stroke="#64748b" stroke-width="2" marker-end="url(#p15)"/>
  <line x1="310" y1="184" x2="290" y2="228" stroke="#64748b" stroke-width="2" marker-end="url(#p15)"/>
  <text x="212" y="308" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">Load-balanced jobs; scale by adding workers</text>
  <text x="212" y="332" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">Use: process each task once</text>

  <rect x="435" y="70" width="345" height="300" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="607" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#166534">Pub/Sub (fan-out)</text>
  <text x="607" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">each message goes to EVERY subscriber</text>

  <rect x="475" y="140" width="90" height="44" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="520" y="167" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">Publisher</text>
  <rect x="650" y="140" width="90" height="44" rx="8" fill="#ede9fe" stroke="#9333ea" stroke-width="1.5"/>
  <text x="695" y="167" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">Topic</text>
  <line x1="565" y1="162" x2="647" y2="162" stroke="#64748b" stroke-width="2" marker-end="url(#p15)"/>

  <rect x="475" y="230" width="90" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="520" y="256" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#334155">Search</text>
  <rect x="575" y="230" width="90" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="620" y="256" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#334155">Analytics</text>
  <rect x="675" y="230" width="90" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="720" y="256" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#334155">Email</text>
  <line x1="690" y1="184" x2="530" y2="228" stroke="#64748b" stroke-width="2" marker-end="url(#p15)"/>
  <line x1="695" y1="184" x2="620" y2="228" stroke="#64748b" stroke-width="2" marker-end="url(#p15)"/>
  <line x1="700" y1="184" x2="715" y2="228" stroke="#64748b" stroke-width="2" marker-end="url(#p15)"/>
  <text x="607" y="308" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">One event, many independent reactions</text>
  <text x="607" y="332" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#166534">Use: broadcast an event</text>

  <defs>
    <marker id="p15" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
  </defs>
</svg>
