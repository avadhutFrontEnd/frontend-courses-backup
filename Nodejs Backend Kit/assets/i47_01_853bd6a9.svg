<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420">
  <rect x="10" y="10" width="800" height="400" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#0f172a">How a server-side session works</text>

  <rect x="40" y="80" width="180" height="70" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="130" y="110" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e3a8a">Browser</text>
  <text x="130" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">Cookie: sid=abc123</text>

  <rect x="320" y="80" width="180" height="70" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="110" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534">Express + middleware</text>
  <text x="410" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">express-session</text>

  <rect x="600" y="80" width="180" height="70" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="690" y="110" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="#6b21a8">Session store</text>
  <text x="690" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">Redis / Mongo</text>

  <line x1="220" y1="105" x2="318" y2="105" stroke="#64748b" stroke-width="2" marker-end="url(#d11)"/>
  <text x="269" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b">sends cookie</text>
  <line x1="500" y1="105" x2="598" y2="105" stroke="#64748b" stroke-width="2" marker-end="url(#d11)"/>
  <text x="549" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b">lookup sid</text>

  <rect x="120" y="185" width="580" height="50" rx="12" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="410" y="215" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="12" fill="#334155">store[&quot;abc123&quot;] = { userId: 42, role: &quot;admin&quot;, cart: [...] }</text>

  <line x1="690" y1="150" x2="690" y2="185" stroke="#9333ea" stroke-width="2" marker-end="url(#d11p)"/>
  <line x1="410" y1="235" x2="410" y2="270" stroke="#16a34a" stroke-width="2" marker-end="url(#d11g)"/>

  <rect x="120" y="270" width="580" height="55" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="295" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#166534">req.session is populated -&gt; route runs with the user known</text>
  <text x="410" y="315" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">The cookie only carries the opaque id; all real data stays server-side</text>

  <text x="410" y="360" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">Logout / revoke = delete the store entry. The signed cookie prevents id tampering.</text>
  <text x="410" y="384" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">The default MemoryStore is for dev only — it leaks memory and dies on restart.</text>

  <defs>
    <marker id="d11" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="d11p" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9333ea"/></marker>
    <marker id="d11g" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
  </defs>
</svg>
