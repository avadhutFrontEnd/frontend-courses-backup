<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect x="0" y="0" width="820" height="440" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-size="23" font-weight="bold" fill="#0f172a">Operational vs Programmer errors</text>

  <rect x="40" y="72" width="350" height="330" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="215" y="104" text-anchor="middle" font-size="17" font-weight="bold" fill="#16a34a">Operational</text>
  <text x="215" y="128" text-anchor="middle" font-size="12" fill="#64748b">expected, part of running</text>

  <text x="70" y="166" font-size="13" fill="#334155">&#183; network timeout</text>
  <text x="70" y="192" font-size="13" fill="#334155">&#183; 404 / bad user input</text>
  <text x="70" y="218" font-size="13" fill="#334155">&#183; DB connection lost</text>
  <text x="70" y="244" font-size="13" fill="#334155">&#183; disk full, rate limited</text>

  <rect x="70" y="272" width="290" height="110" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="215" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">Handle gracefully</text>
  <text x="215" y="326" text-anchor="middle" font-size="12" fill="#334155">retry, return 4xx/5xx,</text>
  <text x="215" y="348" text-anchor="middle" font-size="12" fill="#334155">log, degrade.</text>
  <text x="215" y="370" text-anchor="middle" font-size="12" fill="#334155">Do NOT crash.</text>

  <rect x="430" y="72" width="350" height="330" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="605" y="104" text-anchor="middle" font-size="17" font-weight="bold" fill="#dc2626">Programmer</text>
  <text x="605" y="128" text-anchor="middle" font-size="12" fill="#64748b">bugs in your code</text>

  <text x="460" y="166" font-size="13" fill="#334155">&#183; read prop of undefined</text>
  <text x="460" y="192" font-size="13" fill="#334155">&#183; wrong argument type</text>
  <text x="460" y="218" font-size="13" fill="#334155">&#183; forgot to await</text>
  <text x="460" y="244" font-size="13" fill="#334155">&#183; broken invariant</text>

  <rect x="460" y="272" width="290" height="110" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="605" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">Crash + restart</text>
  <text x="605" y="326" text-anchor="middle" font-size="12" fill="#334155">state is corrupt,</text>
  <text x="605" y="348" text-anchor="middle" font-size="12" fill="#334155">let it die, let a</text>
  <text x="605" y="370" text-anchor="middle" font-size="12" fill="#334155">supervisor restart.</text>
</svg>
