<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="0" y="0" width="820" height="400" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="40" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Semantic Versioning &amp; Ranges</text>
  <text x="410" y="66" text-anchor="middle" font-size="14" fill="#64748b">MAJOR . MINOR . PATCH</text>

  <rect x="130" y="90" width="180" height="90" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="220" y="122" text-anchor="middle" font-size="20" font-weight="700" fill="#991b1b">MAJOR</text>
  <text x="220" y="148" text-anchor="middle" font-size="13" fill="#334155">breaking change</text>
  <text x="220" y="168" text-anchor="middle" font-size="12" fill="#64748b">2.4.1 &#8594; 3.0.0</text>

  <rect x="320" y="90" width="180" height="90" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="410" y="122" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">MINOR</text>
  <text x="410" y="148" text-anchor="middle" font-size="13" fill="#334155">new feature, safe</text>
  <text x="410" y="168" text-anchor="middle" font-size="12" fill="#64748b">2.4.1 &#8594; 2.5.0</text>

  <rect x="510" y="90" width="180" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="122" text-anchor="middle" font-size="20" font-weight="700" fill="#166534">PATCH</text>
  <text x="600" y="148" text-anchor="middle" font-size="13" fill="#334155">bug fix, safe</text>
  <text x="600" y="168" text-anchor="middle" font-size="12" fill="#64748b">2.4.1 &#8594; 2.4.2</text>

  <text x="410" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Ranges with base version 1.2.3</text>

  <rect x="80" y="240" width="320" height="60" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="100" y="266" font-size="15" font-weight="700" fill="#166534" font-family="ui-monospace,monospace">^1.2.3</text>
  <text x="100" y="288" font-size="12.5" fill="#334155">caret: &#8805;1.2.3 &lt;2.0.0 (minor + patch)</text>

  <rect x="420" y="240" width="320" height="60" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
  <text x="440" y="266" font-size="15" font-weight="700" fill="#1e3a8a" font-family="ui-monospace,monospace">~1.2.3</text>
  <text x="440" y="288" font-size="12.5" fill="#334155">tilde: &#8805;1.2.3 &lt;1.3.0 (patch only)</text>

  <rect x="80" y="315" width="320" height="55" rx="10" fill="#fff" stroke="#9333ea" stroke-width="2"/>
  <text x="100" y="340" font-size="15" font-weight="700" fill="#6b21a8" font-family="ui-monospace,monospace">1.2.3</text>
  <text x="100" y="360" font-size="12.5" fill="#334155">exact: only 1.2.3, nothing else</text>

  <rect x="420" y="315" width="320" height="55" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/>
  <text x="440" y="340" font-size="15" font-weight="700" fill="#991b1b" font-family="ui-monospace,monospace">*  or  latest</text>
  <text x="440" y="360" font-size="12.5" fill="#334155">any version &#8212; avoid, unreproducible</text>
</svg>
