<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="1" y="1" width="818" height="358" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">One Loop Turn, Step by Step</text>
  <text x="410" y="62" text-anchor="middle" font-size="13" fill="#64748b">Microtasks squeeze in after every single macrotask callback — not once per phase.</text>

  <!-- timeline steps -->
  <g>
    <rect x="40" y="110" width="150" height="80" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
    <text x="115" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#c2410c">macro cb</text>
    <text x="115" y="164" text-anchor="middle" font-size="11.5" fill="#c2410c">timer fires</text>

    <rect x="230" y="110" width="150" height="80" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2.5"/>
    <text x="305" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#7e22ce">drain micro</text>
    <text x="305" y="156" text-anchor="middle" font-size="11" fill="#7e22ce">nextTick, then</text>
    <text x="305" y="172" text-anchor="middle" font-size="11" fill="#7e22ce">promises</text>

    <rect x="420" y="110" width="150" height="80" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
    <text x="495" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#c2410c">macro cb</text>
    <text x="495" y="164" text-anchor="middle" font-size="11.5" fill="#c2410c">next in queue</text>

    <rect x="610" y="110" width="150" height="80" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2.5"/>
    <text x="685" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#7e22ce">drain micro</text>
    <text x="685" y="156" text-anchor="middle" font-size="11" fill="#7e22ce">again, fully</text>
    <text x="685" y="172" text-anchor="middle" font-size="11" fill="#7e22ce">every time</text>
  </g>

  <g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#ah4)">
    <path d="M 190 150 L 226 150"/>
    <path d="M 380 150 L 416 150"/>
    <path d="M 570 150 L 606 150"/>
  </g>
  <defs>
    <marker id="ah4" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="40" y="228" width="720" height="100" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="410" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">Why this matters</text>
  <text x="410" y="280" text-anchor="middle" font-size="12.5" fill="#166534">A microtask that schedules another microtask keeps the drain going — it can starve the loop.</text>
  <text x="410" y="302" text-anchor="middle" font-size="12.5" fill="#166534">nextTick recursion never yields to timers or I/O: the process appears frozen.</text>
</svg>
