<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340">
  <rect x="10" y="10" width="800" height="320" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="bold" fill="#0f172a">HTTP/1.1 vs HTTP/2 over one connection</text>

  <rect x="40" y="80" width="360" height="210" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="220" y="108" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e3a8a">HTTP/1.1 keep-alive</text>
  <rect x="70" y="128" width="300" height="26" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="220" y="146" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#1e3a8a">request A ---&gt; response A</text>
  <rect x="70" y="164" width="300" height="26" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="220" y="182" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#1e3a8a">request B ---&gt; response B</text>
  <rect x="70" y="200" width="300" height="26" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="220" y="218" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#1e3a8a">request C ---&gt; response C</text>
  <text x="220" y="258" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">Serial on the socket: B waits for A</text>
  <text x="220" y="276" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">(head-of-line blocking)</text>

  <rect x="440" y="80" width="340" height="210" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="610" y="108" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold" fill="#166534">HTTP/2 multiplexing</text>
  <rect x="470" y="128" width="90" height="98" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="515" y="180" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#166534">stream 1</text>
  <rect x="565" y="128" width="90" height="98" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="610" y="180" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#166534">stream 3</text>
  <rect x="660" y="128" width="90" height="98" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="705" y="180" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#166534">stream 5</text>
  <text x="610" y="258" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">Interleaved frames, one TCP connection,</text>
  <text x="610" y="276" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">binary framing + header compression</text>
</svg>
