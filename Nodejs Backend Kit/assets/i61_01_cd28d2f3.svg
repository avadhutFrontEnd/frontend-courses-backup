<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect x="1" y="1" width="818" height="398" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="410" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">Cache-Aside (Lazy Loading) Flow</text>
  <text x="410" y="62" text-anchor="middle" font-size="13" fill="#64748b">App checks Redis first; on a miss it reads the DB and back-fills the cache.</text>

  <!-- app -->
  <rect x="40" y="150" width="150" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="115" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Node app</text>
  <text x="115" y="210" text-anchor="middle" font-size="12" fill="#166534">GET /user/42</text>

  <!-- redis -->
  <rect x="335" y="90" width="150" height="90" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="410" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">Redis</text>
  <text x="410" y="150" text-anchor="middle" font-size="12" fill="#b91c1c">in-memory cache</text>
  <text x="410" y="168" text-anchor="middle" font-size="11" fill="#b91c1c">key user:42</text>

  <!-- db -->
  <rect x="630" y="150" width="150" height="90" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="705" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">Database</text>
  <text x="705" y="210" text-anchor="middle" font-size="12" fill="#1d4ed8">source of truth</text>

  <!-- 1 read cache -->
  <line x1="190" y1="175" x2="333" y2="145" stroke="#16a34a" stroke-width="2" marker-end="url(#ar)"/>
  <text x="250" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">1 GET key</text>

  <!-- hit -->
  <line x1="333" y1="165" x2="192" y2="195" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="250" y="215" text-anchor="middle" font-size="12" fill="#166534">2a HIT return</text>

  <!-- miss to db -->
  <line x1="192" y1="205" x2="628" y2="205" stroke="#3b82f6" stroke-width="2" marker-end="url(#ar)"/>
  <text x="410" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">2b MISS then query DB</text>

  <!-- backfill -->
  <line x1="630" y1="180" x2="486" y2="150" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="570" y="150" text-anchor="middle" font-size="12" fill="#b91c1c">3 SET key EX 300</text>

  <text x="410" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">On write: update DB, then delete the key (invalidate) — do not blindly trust stale cache.</text>
  <text x="410" y="330" text-anchor="middle" font-size="12" fill="#64748b">Set a TTL as a safety net so a missed invalidation self-heals.</text>
  <text x="410" y="356" text-anchor="middle" font-size="12" fill="#64748b">The hard problems: stampede on hot-key miss, and cache/DB consistency.</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
